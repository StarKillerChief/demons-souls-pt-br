<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="Demon's Souls — Tradução PT-BR para o Soulbrandt">
  <defs>
    <radialGradient id="bg" cx="72%" cy="45%" r="75%">
      <stop offset="0" stop-color="#2b2620"/>
      <stop offset="0.55" stop-color="#14110e"/>
      <stop offset="1" stop-color="#070605"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcc0"/>
      <stop offset="1" stop-color="#b59a6a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <!-- thin frame, like the game's menus -->
  <rect x="18" y="18" width="1164" height="324" fill="none" stroke="#5c5142" stroke-width="1.5"/>
  <rect x="26" y="26" width="1148" height="308" fill="none" stroke="#2d271f" stroke-width="1"/>
  <text x="90" y="150" font-family="'EB Garamond', Garamond, 'Times New Roman', serif" font-size="78" letter-spacing="6" fill="#f2ede4">Demon's Souls</text>
  <line x1="92" y1="178" x2="760" y2="178" stroke="#8a7656" stroke-width="1.2"/>
  <text x="92" y="228" font-family="'EB Garamond', Garamond, 'Times New Roman', serif" font-size="34" letter-spacing="10" fill="url(#gold)">TRADUÇÃO PT-BR</text>
  <text x="92" y="272" font-family="'EB Garamond', Garamond, 'Times New Roman', serif" font-size="24" letter-spacing="4" fill="#a99a82">para o Soulbrandt · feita por fãs</text>
  <!-- Brazil flag (public-domain design), drawn -->
  <g transform="translate(905 110)">
    <ellipse cx="80" cy="70" rx="150" ry="110" fill="url(#glow)"/>
    <g transform="skewY(-3)">
      <rect x="0" y="16" width="160" height="112" rx="6" fill="#1e9447"/>
      <polygon points="80,28 148,72 80,116 12,72" fill="#f7d116"/>
      <circle cx="80" cy="72" r="27" fill="#26357f"/>
      <path d="M54 66 Q80 58 106 76" stroke="#f2f2f2" stroke-width="5" fill="none"/>
      <g fill="#fff">
        <circle cx="70" cy="82" r="1.6"/><circle cx="78" cy="88" r="1.4"/><circle cx="88" cy="84" r="1.6"/>
        <circle cx="94" cy="92" r="1.3"/><circle cx="66" cy="92" r="1.3"/><circle cx="82" cy="78" r="1.2"/>
      </g>
    </g>
  </g>
</svg>
